services:
  - type: web
    name: 108-studio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install chromium
    startCommand: python server.py
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: STUDIO_GOOGLE_CLIENT_ID
        sync: false
      - key: STUDIO_SESSION_SECRET
        generateValue: true
      - key: STUDIO_ALLOWED_EMAILS
        sync: false
      - key: STUDIO_SLACK_BOT_TOKEN
        sync: false
