<style>
:root{font-family:Arial,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#192338;background:#f3f5f8}*{box-sizing:border-box}body{margin:0}header{background:#111b30;color:white;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}header strong{letter-spacing:.08em;font-size:20px}header small{color:#aab9d2}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;padding:24px;max-width:1400px;margin:auto}.panel{background:white;border:1px solid #dce1e8;border-radius:12px;padding:20px;align-self:start}h2{font-size:16px;margin:0 0 16px}.field{display:block;margin:12px 0;font-size:12px;font-weight:700;color:#43506a}.field input,.field textarea,.field select{display:block;width:100%;margin-top:6px;border:1px solid #cdd5e0;border-radius:7px;padding:10px;font:inherit;font-weight:400;color:#18233a}.field textarea{resize:vertical;min-height:70px}button{border:0;background:#263e75;color:white;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}.sub{background:#e8ecf4;color:#24395d}.actions{display:flex;gap:8px;flex-wrap:wrap}.hint{color:#69758b;font-size:12px;line-height:1.6}.preview-wrap{overflow:auto}.preview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.page{width:794px;min-height:1123px;background:#fff;margin:auto;padding:66px 64px;box-shadow:0 6px 25px #17223b20;position:relative;overflow:hidden}.page:before{content:'';position:absolute;top:0;left:0;right:0;height:16px;background:#eeb6c7}.brand{font-size:13px;letter-spacing:.15em;color:#60728f}.category{font-size:13px;color:#bb6f8b;margin-top:38px;font-weight:bold}.title{font-size:29px;line-height:1.35;margin:12px 0 26px;border-bottom:3px solid #1e2e4e;padding-bottom:18px;overflow-wrap:anywhere}.meta{display:grid;grid-template-columns:110px 1fr;border-top:1px solid #e2e5ec;font-size:14px}.meta>*{padding:11px 8px;border-bottom:1px solid #e2e5ec;white-space:pre-wrap;overflow-wrap:anywhere}.meta b{background:#f7f8fb}.section{margin-top:24px}.section h3{font-size:16px;color:#22385e;margin:0 0 8px}.section p{font-size:14px;line-height:1.85;white-space:pre-wrap;margin:0;overflow-wrap:anywhere}.ref{margin-top:26px;padding:15px;background:#f5f7fa;border-left:4px solid #eeb6c7;font-size:13px;overflow-wrap:anywhere}.ref a{color:#2a559e}.footer{position:absolute;bottom:26px;right:64px;font-size:11px;color:#9aa5b8}@media(max-width:1100px){.layout{grid-template-columns:1fr}.page{transform-origin:top left}.preview-wrap{overflow:auto}}@media print{@page{size:A4;margin:0}body{background:white}header,.panel,.preview-head{display:none!important}.layout{display:block;padding:0}.page{box-shadow:none;width:210mm;min-height:297mm;padding:17mm 17mm;break-after:page}.preview-wrap{overflow:visible}}

<header><strong>108 STUDIO <small>｜企画資料エディタ・試作版 v0.1</small></strong><span>企画を、提出できる資料へ。</span></header>
<main class="layout"><aside class="panel"><h2>企画を編集</h2><p class="hint">入力内容は右のA4プレビューに即時反映されます。内容はこのブラウザに自動保存されます。</p><div id="fields"></div><div class="actions"><button id="print">PDF出力</button><button class="sub" id="reset">初期値に戻す</button></div><p class="hint">PDF出力を押すと印刷画面が開きます。「PDFに保存」を選択してください。</p></aside><section class="preview-wrap"><div class="preview-head"><h2>A4縦型プレビュー</h2><span class="hint">※現段階は仮デザイン。既存Canvaの完全再現は次の工程です。</span></div><article class="page"><div class="brand" id="v-client"></div><div class="category" id="v-category"></div><h1 class="title" id="v-title"></h1><div class="meta" id="meta"></div><section class="section"><h3>■ 企画内容</h3><p id="v-content"></p></section><section class="section"><h3>■ 撮影 / 演出イメージ</h3><p id="v-shoot"></p></section><section class="section"><h3>■ 狙い / ポイント</h3><p id="v-aim"></p></section><div class="ref">参考動画：<a id="v-url" target="_blank" rel="noopener noreferrer"></a></div><div class="footer">108 STUDIO · PROTOTYPE</div></article></section></main>
<script>
const defs=[['client','クライアント名','text','CUTIE STREET様'],['category','企画カテゴリ','select','楽曲企画'],['title','企画名','text','企画タイトルを入力'],['sound','音源','text',''],['part','箇所','text',''],['members','メンバー','textarea',''],['location','場所 / 衣装','textarea',''],['content','企画内容','textarea',''],['shoot','撮影 / 演出イメージ','textarea',''],['aim','狙い / ポイント','textarea',''],['url','参考動画URL','url','']];
const key='108-studio-draft-v1';let data;try{data=JSON.parse(localStorage.getItem(key)||'{}')}catch{data={}};const root=document.getElementById('fields');for(const [id,label,type,initial] of defs){const wrap=document.createElement('label');wrap.className='field';wrap.textContent=label;const el=document.createElement(type==='textarea'?'textarea':type==='select'?'select':'input');el.id='f-'+id;if(type==='select'){for(const x of ['楽曲企画','ミーム企画','その他']){const o=document.createElement('option');o.value=x;o.textContent=x;el.appendChild(o)}}else if(type!=='textarea')el.type=type;el.value=data[id]??initial;el.addEventListener('input',render);wrap.appendChild(el);root.appendChild(wrap)}
function render(){const d={};for(const [id] of defs)d[id]=document.getElementById('f-'+id).value;localStorage.setItem(key,JSON.stringify(d));for(const id of ['client','category','title','content','shoot','aim'])document.getElementById('v-'+id).textContent=d[id]||'—';const meta=document.getElementById('meta');meta.replaceChildren();for(const [id,label] of [['sound','音源'],['part','箇所'],['members','メンバー'],['location','場所 / 衣装']]){const b=document.createElement('b');b.textContent=label;const s=document.createElement('span');s.textContent=d[id]||'—';meta.append(b,s)}const link=document.getElementById('v-url');const u=d.url.trim();if(/^https?:\/\//i.test(u)){link.href=u;link.textContent=u;link.style.pointerEvents='auto'}else{link.removeAttribute('href');link.textContent=u||'未設定';link.style.pointerEvents='none'}}
document.getElementById('print').onclick=()=>window.print();document.getElementById('reset').onclick=()=>{if(confirm('入力内容を初期化しますか？')){localStorage.removeItem(key);location.reload()}};render();
</script></body></html>
